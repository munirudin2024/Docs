services:
  postgres:
    image: postgres:17
    container_name: postgres_pgdb
    environment:
      POSTGRES_USER: pguser
      POSTGRES_DB: pgdb
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    ports:
      - "5432:5432"  # Expose untuk remote access dari HP
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./secrets/pg_password.txt:/run/secrets/pg_password:ro
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pgdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  rust:
    image: rust:latest
    container_name: rust_dev
    hostname: rust-power
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./app-rust:/workspace
    working_dir: /workspace
    networks:
      - internal_net
    command: sleep infinity
    restart: unless-stopped

  jira:
    image: atlassian/jira-software:latest
    container_name: jira_software
    ports:
      - "18080:8080"
    environment:
      - ATL_JIRA_DB_TYPE=postgres72
      - ATL_JIRA_DB_HOST=postgres_pgdb
      - ATL_JIRA_DB_PORT=5432
      - ATL_JIRA_DB_NAME=pgdb
      - ATL_JIRA_DB_USER=pguser
      - ATL_JIRA_DB_PASSWORD_FILE=/run/secrets/pg_password
    volumes:
      - jira_data:/var/atlassian/application-data/jira
      - ./secrets/pg_password.txt:/run/secrets/pg_password:ro
    networks:
      - internal_net
    depends_on:
      - postgres
    restart: unless-stopped

  inventori-be:
    image: rust:latest
    container_name: inventori_be
    hostname: inventori-be
    working_dir: /workspace/inventori-be
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./app-rust:/workspace
    environment:
      JWT_SECRET: supersecret
      DATABASE_URL: postgres://pguser:sisfo%401@postgres_pgdb/pgdb
    ports:
      - "13000:3000"
    networks:
      - internal_net
    command: bash -c "export PATH=/usr/local/cargo/bin:$$PATH && cargo run"
    restart: unless-stopped

  kali:
    build:
      context: .
      dockerfile: Dockerfile.kali
    image: kali-pentest:latest
    container_name: kali_lab
    hostname: kali-tactical
    networks:
      - internal_net
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    restart: unless-stopped

  bun:
    image: oven/bun:latest
    container_name: bun_dev
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5173:5173"  # Vite
      - "3000:3000"  # Next.js
    networks:
      - internal_net
    volumes:
      - ./app-bun:/workspace
    working_dir: /workspace
    command: sleep infinity
    restart: unless-stopped

  dotnet:
    image: mcr.microsoft.com/dotnet/sdk:latest
    container_name: dotnet_dev
    user: "${UID:-1000}:${GID:-1000}"
    networks:
      - internal_net
    volumes:
      - ./app-dotnet:/workspace
    working_dir: /workspace
    command: sleep infinity
    restart: unless-stopped

  neovim:
    build:
      context: .
      dockerfile: Dockerfile.neovim
    image: neovim-dev:latest
    container_name: neovim_dev
    hostname: neovim-dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
      - ./dotfiles/nvim:/home/dev/.config/nvim:rw
    working_dir: /workspace
    networks:
      - internal_net
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    restart: unless-stopped

  node:
    image: node:latest
    container_name: node_dev
    hostname: node-power
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./node:/workspace
    working_dir: /workspace
    networks:
      - internal_net
    command: sleep infinity
    restart: unless-stopped

networks:
  internal_net:
    driver: bridge

volumes:
  pgdata:
  jira_data: