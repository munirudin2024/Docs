version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: pguser
      POSTGRES_DB: pgdb
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal_net
    secrets:
      - source: pg_password
        target: /run/secrets/pg_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pgdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure

  rust:
    image: rust:1.76-slim
    volumes:
      - ./app-rust:/workspace
    working_dir: /workspace
    networks:
      - internal_net
    command: sleep infinity
    deploy:
      restart_policy:
        condition: on-failure

  kali:
    image: kali-pentest:latest
    networks:
      - internal_net
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
    deploy:
      restart_policy:
        condition: on-failure

  bun:
    image: oven/bun:latest
    networks:
      - internal_net
    volumes:
      - ./app-bun:/workspace
    working_dir: /workspace
    command: sleep infinity
    deploy:
      restart_policy:
        condition: on-failure

  dotnet:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    networks:
      - internal_net
    volumes:
      - ./app-dotnet:/workspace
    working_dir: /workspace
    command: sleep infinity
    deploy:
      restart_policy:
        condition: on-failure

  neovim:
    image: neovim-dev:latest
    volumes:
      - ./app-rust:/workspace
      - ./dotfiles/nvim:/home/dev/.config/nvim:rw
    working_dir: /workspace
    networks:
      - internal_net
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    deploy:
      restart_policy:
        condition: on-failure

  firebase:
    image: firebase-studio:latest
    volumes:
      - ./firebase:/workspace
      - ~/.config/firebase:/home/dev/.config/firebase:rw
    working_dir: /workspace
    ports:
      - "4000:4000"
      - "8080:8080"
      - "9099:9099"
      - "5001:5001"
      - "5000:5000"
    environment:
      - TZ=Asia/Jakarta
    networks:
      - internal_net
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    deploy:
      restart_policy:
        condition: on-failure

networks:
  internal_net:
    driver: overlay

volumes:
  pgdata:

secrets:
  pg_password:
    external: true
